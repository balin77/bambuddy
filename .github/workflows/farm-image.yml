name: Farm image

# Builds the farm image from the `farm` branch and publishes it to GHCR:
#   ghcr.io/balin77/bambuddy:farm
#   ghcr.io/balin77/bambuddy:farm-<short-sha>
# Fork-only: the job is skipped in any other repository.

on:
  push:
    branches: [farm]
  workflow_dispatch:

concurrency:
  group: farm-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    if: github.repository == 'balin77/bambuddy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        run: echo "short_sha=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/balin77/bambuddy:farm
            ghcr.io/balin77/bambuddy:farm-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/balin77/bambuddy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Bambuddy farm build (branch farm)
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=farm-image
          cache-to: type=gha,scope=farm-image,mode=max
